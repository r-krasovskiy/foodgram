server {
  listen 80;
  index index.html;
  server_tokens off;

  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:9000/api/;
    client_max_body_size 20M;
  }

  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:9000/admin/;
    client_max_body_size 20M;
  }

  location /media/ {
    alias /app/media/;
    client_max_body_size 20M;
  }

  location / {
      root /app/static/;
      index index.html;
      try_files $uri $uri/ /index.html;
      client_max_body_size 20M;
  }
}
